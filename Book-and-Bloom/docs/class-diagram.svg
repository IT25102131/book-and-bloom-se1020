<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120"><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6 1 11Z" fill="#fbfaf6" stroke="#526953"/></marker></defs><rect width="1200" height="1120" fill="#fbfaf6"/><style>text{font-family:Arial,sans-serif;fill:#293f34}.title{font-size:28px;font-weight:600}.subtitle{font-size:13px;fill:#71816a}.name{font-size:17px;font-weight:600}.field{font-size:12px}.label{font-size:11px;fill:#667c5d}</style><text x="50" y="48" class="title">Book &amp; Bloom · Class architecture</text><text x="50" y="74" class="subtitle">SE1020 | inheritance, associations, composition and repository abstraction</text><rect x="65" y="115" width="275" height="145" rx="5" fill="white" stroke="#bcc8b0"/><path d="M65 163h275" stroke="#bcc8b0"/><text x="80" y="136" class="label">abstract</text><text x="80" y="155" class="name">Book</text><text x="80" y="185" class="field">- id, title, authorId, categoryId</text><text x="80" y="205" class="field">- price: BigDecimal, stock: int</text><text x="80" y="225" class="field">+ requiresShipping(): boolean</text><text x="80" y="245" class="field">+ fulfillment(): String</text><rect x="65" y="325" width="130" height="105" rx="5" fill="white" stroke="#bcc8b0"/><path d="M65 373h130" stroke="#bcc8b0"/><text x="80" y="346" class="label">extends Book</text><text x="80" y="365" class="name">PrintedBook</text><text x="80" y="395" class="field">- pages: int</text><text x="80" y="415" class="field">+ requiresShipping()</text><rect x="215" y="325" width="125" height="105" rx="5" fill="white" stroke="#bcc8b0"/><path d="M215 373h125" stroke="#bcc8b0"/><text x="230" y="346" class="label">extends Book</text><text x="230" y="365" class="name">EBook</text><text x="230" y="395" class="field">- fileFormat</text><text x="230" y="415" class="field">+ requiresShipping()</text><path d="M130 325L170 260" fill="none" stroke="#718569" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M275 325L230 260" fill="none" stroke="#718569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="425" y="115" width="220" height="85" rx="5" fill="white" stroke="#bcc8b0"/><path d="M425 163h220" stroke="#bcc8b0"/><text x="440" y="136" class="label">entity</text><text x="440" y="155" class="name">Author</text><text x="440" y="185" class="field">- id, name, bio</text><rect x="425" y="265" width="220" height="85" rx="5" fill="white" stroke="#bcc8b0"/><path d="M425 313h220" stroke="#bcc8b0"/><text x="440" y="286" class="label">entity</text><text x="440" y="305" class="name">Category</text><text x="440" y="335" class="field">- id, name, description</text><path d="M340 165L425 165" fill="none" stroke="#718569" stroke-width="1.5"/><text x="390.5" y="158.0" class="label">0..* : 1</text><path d="M340 235L425 303" fill="none" stroke="#718569" stroke-width="1.5"/><text x="390.5" y="262.0" class="label">0..* : 1</text><rect x="760" y="115" width="350" height="145" rx="5" fill="white" stroke="#bcc8b0"/><path d="M760 163h350" stroke="#bcc8b0"/><text x="775" y="136" class="label">abstract</text><text x="775" y="155" class="name">User</text><text x="775" y="185" class="field">- id, name, email, passwordHash, address</text><text x="775" y="205" class="field">+ canManageCatalog(): boolean</text><text x="775" y="225" class="field">+ role(): String</text><text x="775" y="245" class="field">+ publicProfile(): Map</text><rect x="760" y="325" width="160" height="105" rx="5" fill="white" stroke="#bcc8b0"/><path d="M760 373h160" stroke="#bcc8b0"/><text x="775" y="346" class="label">extends User</text><text x="775" y="365" class="name">Customer</text><text x="775" y="395" class="field">+ canManageCatalog()</text><text x="775" y="415" class="field">  returns false</text><rect x="950" y="325" width="160" height="105" rx="5" fill="white" stroke="#bcc8b0"/><path d="M950 373h160" stroke="#bcc8b0"/><text x="965" y="346" class="label">extends User</text><text x="965" y="365" class="name">AdminUser</text><text x="965" y="395" class="field">+ canManageCatalog()</text><text x="965" y="415" class="field">  returns true</text><path d="M840 325L890 260" fill="none" stroke="#718569" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1025 325L985 260" fill="none" stroke="#718569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="65" y="500" width="275" height="125" rx="5" fill="white" stroke="#bcc8b0"/><path d="M65 548h275" stroke="#bcc8b0"/><text x="80" y="521" class="label">entity</text><text x="80" y="540" class="name">Order</text><text x="80" y="570" class="field">- id, userId, status, address</text><text x="80" y="590" class="field">- subtotal, deliveryFee, total</text><text x="80" y="610" class="field">- lines: List&lt;OrderLine&gt;</text><rect x="425" y="500" width="260" height="105" rx="5" fill="white" stroke="#bcc8b0"/><path d="M425 548h260" stroke="#bcc8b0"/><text x="440" y="521" class="label">value snapshot</text><text x="440" y="540" class="name">OrderLine</text><text x="440" y="570" class="field">- bookId, title, unitPrice</text><text x="440" y="590" class="field">- quantity, shipping</text><path d="M340 548L425 548" fill="none" stroke="#718569" stroke-width="1.5"/><text x="390.5" y="541.0" class="label">1 : 1..*</text><rect x="760" y="500" width="350" height="105" rx="5" fill="white" stroke="#bcc8b0"/><path d="M760 548h350" stroke="#bcc8b0"/><text x="775" y="521" class="label">entity</text><text x="775" y="540" class="name">Review</text><text x="775" y="570" class="field">- id, userId, bookId</text><text x="775" y="590" class="field">- rating: int, comment: String</text><text x="65" y="675" class="subtitle">User 1 → many Orders / Reviews · Book 1 → many Reviews · Order owns its OrderLines (composition).</text><rect x="65" y="735" width="275" height="105" rx="5" fill="white" stroke="#bcc8b0"/><path d="M65 783h275" stroke="#bcc8b0"/><text x="80" y="756" class="label">extends HttpServlet</text><text x="80" y="775" class="name">ApiServlet</text><text x="80" y="805" class="field">+ service(request, response)</text><text x="80" y="825" class="field">Session, CSRF and JSON boundary</text><rect x="425" y="735" width="310" height="125" rx="5" fill="white" stroke="#bcc8b0"/><path d="M425 783h310" stroke="#bcc8b0"/><text x="440" y="756" class="label">business rules</text><text x="440" y="775" class="name">Six CRUD services</text><text x="440" y="805" class="field">UserService · BookService</text><text x="440" y="825" class="field">AuthorService · CategoryService</text><text x="440" y="845" class="field">OrderService · ReviewService</text><path d="M340 792L425 792" fill="none" stroke="#718569" stroke-width="1.5"/><text x="390.5" y="785.0" class="label">delegates</text><rect x="830" y="735" width="280" height="105" rx="5" fill="white" stroke="#bcc8b0"/><path d="M830 783h280" stroke="#bcc8b0"/><text x="845" y="756" class="label">interface</text><text x="845" y="775" class="name">StoreRepository</text><text x="845" y="805" class="field">+ snapshot(): StoreState</text><text x="845" y="825" class="field">+ transaction(Function): T</text><path d="M735 792L830 792" fill="none" stroke="#718569" stroke-width="1.5"/><text x="790.5" y="785.0" class="label">uses</text><rect x="830" y="930" width="280" height="105" rx="5" fill="white" stroke="#bcc8b0"/><path d="M830 978h280" stroke="#bcc8b0"/><text x="845" y="951" class="label">implements StoreRepository</text><text x="845" y="970" class="name">FileStoreRepository</text><text x="845" y="1000" class="field">- file, processLock, state</text><text x="845" y="1020" class="field">Atomic UTF-8 text persistence</text><path d="M970 930L970 840" fill="none" stroke="#718569" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="425" y="930" width="310" height="105" rx="5" fill="white" stroke="#bcc8b0"/><path d="M425 978h310" stroke="#bcc8b0"/><text x="440" y="951" class="label">aggregate snapshot</text><text x="440" y="970" class="name">StoreState</text><text x="440" y="1000" class="field">Six collections + schemaVersion</text><text x="440" y="1020" class="field">Stored in data/bookstore.txt</text><path d="M830 990L735 990" fill="none" stroke="#718569" stroke-width="1.5"/><text x="790.5" y="983.0" class="label">stores</text><text x="65" y="1078" class="subtitle">All persisted fields are private. Routine accessors omitted. ID-based associations avoid cyclic serialization.</text></svg>