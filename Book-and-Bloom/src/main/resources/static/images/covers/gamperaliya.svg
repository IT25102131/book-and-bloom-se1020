<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="600" fill="url(#bg)"/>
  
  <!-- Subtle Texture Grid -->
  <rect width="400" height="600" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Ornate Decorative Frame -->
  <rect x="20" y="20" width="360" height="560" rx="4" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="25" y="25" width="350" height="550" rx="2" fill="none" stroke="#FDE047" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Top Ribbon Banner -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="320" height="24" rx="12" fill="rgba(0,0,0,0.35)"/>
    <text x="160" y="16" fill="#FDE047" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2" text-anchor="middle">PIONEER OF MODERN SINHALA LITERATURE</text>
  </g>

  <!-- Title & Subtitle Block -->
  <g transform="translate(200, 112)" text-anchor="middle">
    <text y="0" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">GAMPERALIYA</text>
       <text y="30" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">(ගම්පෙරළිය)</text>
       <text y="58" fill="rgba(255,255,255,0.88)" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">The Fall of the Southern Kaisaruwatte Manor</text>
  </g>

  <!-- Center Artwork -->
  <g transform="translate(200, 310)">
    <circle cx="0" cy="0" r="75" fill="rgba(255,255,255,0.06)" stroke="#FDE047" stroke-width="1.5"/>
          <polygon points="0,-40 50,0 0,40 -50,0" fill="none" stroke="#FDE047" stroke-width="2"/>
          <text y="8" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="800" text-anchor="middle">ගම්</text>
  </g>

  <!-- Bottom Author Banner -->
  <g transform="translate(200, 520)" text-anchor="middle">
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#FDE047" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="3" fill="#FDE047"/>
    <text y="24" fill="#FDE047" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5">MARTIN WICKRAMASINGHE</text>
    <text y="40" fill="rgba(255,255,255,0.65)" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.5">SARASAVI · BOOK &amp; BLOOM PRESS</text>
  </g>

  <!-- 3D Spine Crease Highlight -->
  <rect x="0" y="0" width="20" height="600" fill="url(#spine)"/>
  
  <!-- Right Page Edge -->
  <rect x="394" y="4" width="4" height="592" fill="#E2E8F0" opacity="0.6"/>
</svg>